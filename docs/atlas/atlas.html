<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>IsaacPerez.co Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>
      <div id="flowSel"></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="what" class="on">What it does</button>
        <button data-tab="how">How it's built</button>
        <button data-tab="cond">Open questions</button>
      </div>
      <div id="body"></div>
    </aside>
  </div>
  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"pages","title":"What a visitor lands on"},{"id":"runtime","title":"What runs in the browser"},{"id":"assets","title":"What ships with the page"},{"id":"ship","title":"How it gets live"},{"id":"off","title":"Not yet switched on"}];
const NODES = [{"id":"L","code":"L","name":"Landing page","short":"LANDING PAGE","group":"pages","gx":0.5,"gy":8,"w":2.5,"d":2.5,"h":40,"kind":"screen","one":"The personal front door: who Isaac is, his engineering experience, and the company he founded.","what":"Three sections in order: Me, with the original portrait and personal introduction; Experience, with Tinder, Nextdoor, and UC Berkeley (EECS); My company, with the only FIRSTUNIT branding and one link to firstunit.io. A quiet footer holds personal contact links. The former product catalogue, photo promotion, game, achievements and skills marquee are absent.","how":"<code>index.html</code> is hand-written HTML with relative asset paths. It loads homepage-only <code>css/personal.css</code> and <code>js/personal.js</code>; <code>css/site.css</code> may supply shared base tokens. The theme pre-paint IIFE remains inline before the stylesheets. <code>js/site.js</code>, <code>js/game.js</code> and <code>css/game.css</code> are not homepage dependencies. Native homepage anchors retain <code>#about</code> for Me, <code>#experience</code> and the legacy <code>#work</code> target for Experience, <code>#firstunit</code> for My company, and <code>#contact</code> for the footer.","steps":[["Pre-paint theme","The inline head IIFE applies the saved theme before stylesheet parsing."],["Me","Render the personal introduction and original isaac.JPG portrait."],["Experience","Show Tinder, Nextdoor, and UC Berkeley (EECS) in the second section."],["My company","Present FIRSTUNIT only here and link to https://firstunit.io."],["Contact","Close with quiet personal links rather than a service-booking funnel."]],"cond":[{"q":"Should the homepage still download and bake the office when nobody opens it?","r":"No. The user removed the office from the personal homepage. Game markup, achievement integration and the game CSS/JS dependencies are absent; the source assets remain dormant in the repository (2026-09-11)."}]},{"id":"P","code":"P","name":"/photo/ redirect","short":"PHOTO → FU—0001","group":"pages","gx":0.5,"gy":11,"w":2.5,"d":2,"h":16,"kind":"box","one":"A preserved permanent redirect from the former photo page to FIRSTUNIT Studios.","what":"Requests to /photo or /photo/ reach the existing FIRSTUNIT Studios record. There is no photo/index.html and no photography portfolio on the personal homepage. The retained pricing page has its own separate route.","how":"Two <code>vercel.json</code> redirect rules use <code>permanent: true</code> and point to <code>https://firstunit.io/fu-0001</code>. Vercel currently returns <mark>HTTP 308</mark> for both. The redirected path is excluded from the sitemap. The external retired domain <code>capturedbyip.com</code> returns HTTP 301 directly to the same destination (verified 2026-09-11); its configuration is outside this repository.","steps":[["Request","GET /photo or /photo/ reaches Vercel."],["Redirect","Return HTTP 308 with Location: https://firstunit.io/fu-0001."],["Land","The destination renders FIRSTUNIT Studios."]],"cond":[{"q":"Does capturedbyip.com still take two hops through /photo/?","r":"No. Live verification found capturedbyip.com returning HTTP 301 directly to https://firstunit.io/fu-0001. This repository separately retains its /photo redirects for older inbound links (2026-09-11)."}]},{"id":"R","code":"R","name":"Pricing page","short":"PRICING","group":"pages","gx":3.5,"gy":11,"w":2.5,"d":2,"h":36,"kind":"screen","one":"A retained pricing utility page, available by URL but unpromoted on the personal homepage.","what":"Four existing packages and their add-ons, booking explanation, and quote CTAs remain intact. Removing their homepage promotion does not remove or change the offers.","how":"<code>photo/pricing/index.html</code> continues to load <code>/css/site.css</code>, <code>/css/photo.css</code> and <code>/js/site.js</code>. Its four visible prices and <code>OfferCatalog</code> JSON-LD must remain in step. Existing FIRSTUNIT practice copy and wordmark remain on this retained utility page; the homepage company-only branding rule does not silently authorize changing this page. Every quote CTA mails <code>hello@firstunit.io</code> — the enquiries address FIRSTUNIT publishes for the practice this page prices — with the package in the subject; the nav and footer still link back to the homepage sections.","steps":[["Serve","A direct or indexed visit receives /photo/pricing/index.html."],["Read","The four packages and existing add-ons render with the shared utility styles."],["Quote","Each CTA opens a mail to hello@firstunit.io with its own package in the subject."]],"cond":[{"q":"Should removing homepage pricing promotion delete or rebrand the pricing page?","r":"No. The user approved retaining every sitemap route and keeping this utility page functional but unpromoted. A later relocation or offer change is separate work (2026-09-11)."}]},{"id":"D","code":"D","name":"ShootSort page","short":"SHOOTSORT","group":"pages","gx":0.5,"gy":14,"w":2.5,"d":2,"h":32,"kind":"screen","one":"A retained public ShootSort download page, without a homepage product card.","what":"Existing visitors can still read the card-ingest promise, folder structure and system requirements, then download the macOS app. The personal homepage no longer promotes the app.","how":"<code>shootsort/index.html</code> retains <code>/css/site.css</code>, its page-scoped style block and <code>/js/site.js</code>. Download buttons target the public <code>github.com/IsaacAPerez/ShootSort-releases/releases/latest/download/ShootSort.zip</code> endpoint. The source repository remains outside this site. Existing navigation to <code>/#work</code> now reaches the Experience section through a retained native anchor, without restoring the apps catalogue.","steps":[["Serve","A direct visit receives /shootsort/index.html."],["Read","Existing instructions and requirements render with the utility styles."],["Download","The latest-release URL follows to the public macOS download."],["Return","Homepage and contact links retain useful destinations."]],"cond":[{"q":"The page claims Apple silicon + macOS 14 and a notarized build, taken from <code>dist/appcast.xml</code> and the README. Nothing re-checks that when ShootSort ships a release — should the requirements line be generated, or is a page that only changes when the app's floor changes fine as prose?"}]},{"id":"Q","code":"Q","name":"App-facing legal pages","short":"APP LEGAL","group":"pages","gx":0.5,"gy":5,"w":2.5,"d":2,"h":34,"kind":"screen","one":"The privacy, terms and support pages two iOS apps point their App Store listings at.","what":"Four plain documents. For Quarters: a privacy page (last updated May 4 2026) naming exactly what the app collects (Sign in with Apple identifier, chore-proof photos, chat messages, push tokens) and where it lives (Supabase Postgres and storage in AWS us-west-1), a terms page covering households, owners, bills and termination, and a support page. For Souvenir: a privacy page that accounts, field by field, for the one photograph per place that leaves the device when a book is pressed.","how":"<code>roommate/{privacy,terms,support}/index.html</code> and <code>souvenir/privacy/index.html</code>. They are the only pages on <code>/css/legal.css</code> — the tokens, reset and base type of the fleet design system, without the 76% of it (buttons, cards, navs, heroes, device frames, utilities) these pages never render — a different token set (<code>--color-accent: #0071e3</code>, <code>--space-*</code>) from the rest of the site — plus a page-local <code>&lt;style&gt;</code> block for <code>.legal-container</code> (Souvenir's extends it with table, <code>&lt;pre&gt;</code> and <code>h3</code> rules). Absolute asset paths, canonical links to their exact URLs, no JS beyond the theme pre-paint IIFE. <mark>The path is permanent</mark>: the app renamed RoommateApp → Crib → Quarters and <code>/roommate/</code> stayed. Two of the four are renderings, not originals: <code>/souvenir/privacy/</code> comes from <code>~/Coding/Souvenir/docs/privacy.md</code>, and <code>/roommate/support/</code> deliberately summarises and links to <code>thequarters.app/support</code> (the URL App Store Connect actually declares) rather than forking that FAQ.","steps":[["Serve","Vercel returns the directory index for /roommate/privacy/, /roommate/terms/, /roommate/support/ or /souvenir/privacy/."],["Style","legal.css provides the tokens; a page-local style block lays out the legal container."],["Read","Static prose — collection, use, storage, choices, children, changes, contact."],["Exit","One footer link back to isaacperez.co."]],"cond":[{"q":"Should these move to <code>/quarters/</code> now that the app has its final name?","r":"No. App Store metadata and external systems point at the existing URLs; AGENTS.md marks the path permanent and allows only copy renames — and a rename must match <code>\\bCrib\\b</code> case-sensitively, a precaution the rename commit 85c58c1 records because a case-insensitive replace would mangle the word \"describes\" in the privacy policy (2026-08-24)."}]},{"id":"G","code":"G","name":"Retained office source","short":"DORMANT OFFICE","group":"assets","gx":6.5,"gy":6.5,"w":3,"d":3,"h":62,"kind":"tall","one":"The previous canvas office implementation remains on disk but has no homepage entry point.","what":"js/game.js and css/game.css are retained assets that .vercelignore keeps out of the deployment, so neither is fetchable. The personal homepage does not load them, render their canvas or controls, expose the #office experience, or initialize their art and animation loop.","how":"The existing game IIFE contains its tile map, entities, canvas renderer, audio and browser-state helpers. Its former homepage markup and inline achievement engine have been removed from the active surface. The retained JavaScript and stylesheet alone are not a standalone game page. Restoring an office experience would require an explicit future scope decision.","steps":[["Retain","Keep js/game.js and css/game.css unchanged on disk, and listed in .vercelignore."],["Exclude","Do not reference either asset from index.html."],["Stay dormant","No canvas, game initialization, audio, animation loop or game-state writes run on homepage visits."]],"cond":[{"q":"Should the office return as a footer easter egg?","r":"No. The approved personal homepage contains Me, Experience and My company with a quiet contact footer, and explicitly excludes the office game. The source is retained without an entry point (2026-09-11)."}],"ghost":true},{"id":"M","code":"M","name":"Page behavior","short":"PAGE SCRIPTS","group":"runtime","gx":3.5,"gy":8,"w":2.5,"d":2,"h":36,"kind":"box","one":"Homepage behavior is separate from the unchanged utility-page motion script.","what":"Editorial adds one-time scroll reveals, a clipped portrait hover zoom, timed link underlines and arrow movements, and theme transitions. The homepage behavior stays independent of js/site.js, which remains unchanged for pricing, ShootSort and other existing utility surfaces.","how":"Both scripts stay vanilla IIFEs. <code>js/personal.js</code> handles the theme and uses IntersectionObserver to trigger one-time native Web Animations on <code>[data-reveal]</code> elements. Baseline content stays visible: supported motion briefly fades and translates it on entry, while missing APIs or reduced motion leave it fully readable. Live <code>prefers-reduced-motion</code> changes cancel active reveals; focus and hash navigation reveal their targets immediately. Anchors use native scrolling, with smooth behavior disabled under reduced motion. The homepage loads no <code>js/site.js</code> or external animation dependency; the retained shared utility script is unchanged.","steps":[["Baseline","Keep content visible without JavaScript or animation support."],["Scroll entry","IntersectionObserver starts each eligible Web Animation once and then unobserves it."],["Hover","CSS clips portrait zoom within its rounded mask and animates links, arrows and theme changes when motion is allowed."],["Respect preferences","Respond to live reduced-motion changes and cancel active reveals."],["Keep navigation immediate","Focus and hash navigation reveal their destinations immediately while native anchors retain #about, #experience, #work, #firstunit and #contact."],["Utility pages","Keep js/site.js and its behavior unchanged."]],"cond":[]},{"id":"T","code":"T","name":"Theme switch","short":"THEME SWITCH","group":"runtime","gx":3.5,"gy":5,"w":2.5,"d":2,"h":34,"kind":"box","one":"A saved light or dark preference shared by the personal homepage and utility pages.","what":"The pre-paint script applies the saved theme early. Page-specific runtime code changes and stores the theme on request; there are no homepage achievement rewards or game-art updates.","how":"Each page keeps the existing inline head IIFE reading <code>localStorage[\"theme\"]</code> and setting <code>data-theme</code> before styles load. <code>js/personal.js</code> handles the homepage toggle; <code>js/site.js</code> handles utility pages. Runtime storage access is guarded. CSS answers through the root theme attribute and the system color-scheme preference.","steps":[["Pre-paint","Apply the saved theme before styles parse."],["Toggle","The page script computes and stores the next theme."],["Restyle","CSS custom properties and page rules react to data-theme."]],"cond":[{"q":"Every other localStorage access is try/catch-wrapped for Safari private mode; the pre-paint IIFEs call <code>getItem</code> bare. Bug?","r":"Deliberate. AGENTS.md rules that the inline pre-paint script stays verbatim in <code>&lt;head&gt;</code> before the stylesheets — never externalized, never deferred — because it exists to prevent FOUC (2026-08-24)."}]},{"id":"A","code":"A","name":"Removed achievement integration","short":"NO ACHIEVEMENTS","group":"assets","gx":6.5,"gy":3.5,"w":2.5,"d":2,"h":34,"kind":"box","one":"The former homepage achievement engine and toast UI are no longer active.","what":"There is no inline award engine, theme-toggle badge, Konami listener, achievement counter or toast stack on the personal homepage. Old browser values are left alone.","how":"The former integration lived inside <code>index.html</code> and cooperated with <code>js/game.js</code>. That homepage markup and script have been removed. Game-side helpers remain only in the dormant game source; they do not execute because the homepage no longer loads it.","steps":[["Remove active integration","Omit the old inline engine and achievement markup from index.html."],["Preserve old data","Do not clear ip-achievements or ip-game-state as part of the homepage revision."]],"cond":[{"q":"Should theme changes still unlock a badge outside the game?","r":"No. Achievement UI and code are excluded from the personal homepage. The theme toggle only changes the theme (2026-09-11)."}],"ghost":true},{"id":"S","code":"S","name":"Browser storage","short":"BROWSER STORE","group":"runtime","gx":7,"gy":10.5,"w":3,"d":2.5,"h":24,"kind":"store","one":"The active persistent website preference is the theme in the visitor’s browser.","what":"The personal homepage remembers light or dark mode. There is no website account, application backend, analytics or game-state activity on the new homepage.","how":"<code>localStorage[\"theme\"]</code> is read by the pre-paint IIFE and written by the active page script. Historic <code>ip-achievements</code> and <code>ip-game-state</code> values may remain in a returning visitor’s browser, but the new homepage neither reads nor writes them. Runtime theme storage access remains guarded; the existing inline pre-paint scripts are retained.","steps":[["Read","Apply the saved theme before page paint."],["Write","Save the preference when the visitor toggles it."],["Leave history alone","Old game keys remain dormant; no migration or clearing is needed."]],"cond":[]},{"id":"C","code":"C","name":"Stylesheets","short":"STYLESHEETS","group":"assets","gx":10.5,"gy":8,"w":2.5,"d":2,"h":34,"kind":"cards","one":"Homepage-only styles sit beside stable utility-page styles and dormant legacy sheets.","what":"The personal homepage has css/personal.css. Pricing, ShootSort, the custom 404 and legal pages retain their existing stylesheet ownership. Game and RPG sheets remain on disk without homepage references.","how":"<code>css/personal.css</code> owns the homepage layout and components, including the portrait’s 28px rounded mask and fine-pointer hover zoom, timed underlines, arrow movements and theme transitions. CSS motion is gated by <code>prefers-reduced-motion</code>; native smooth scrolling becomes immediate scrolling when reduction is requested. <code>css/site.css</code> remains unchanged for utility pages. Pricing adds <code>css/photo.css</code>. The four legal-style pages use <code>css/legal.css</code>, the token subset of the fleet design system. ShootSort and 404 keep their scoped style blocks. <code>css/game.css</code> and <code>css/rpg.css</code> are not loaded by the homepage.","steps":[["Homepage","Use css/personal.css for the selected personal-page variation."],["Utility pages","Keep site.css and page-specific additions unchanged."],["Legal pages","Keep the separate legal.css token system."],["Dormant assets","Retain game.css and rpg.css without links from the homepage."]],"cond":[]},{"id":"I","code":"I","name":"Images & documents","short":"IMAGES & DOCS","group":"assets","gx":10.5,"gy":11,"w":3,"d":2.5,"h":24,"kind":"store","one":"The original portrait stays prominent; existing images and the unlinked résumé stay on disk.","what":"Me uses Isaac’s original isaac.JPG inside a 28px rounded frame that clips its fine-pointer hover zoom. Tinder and Nextdoor employer logos, the Berkeley seal, and the favicon remain available. Product icons are retained even though the apps catalogue is removed. Resume.pdf remains unlinked because it is the old résumé.","how":"Assets are committed directly, with no transformation pipeline. The exact case of <code>isaac.JPG</code> matters on Vercel. Homepage references are relative; utility references are absolute. The original image also supplies existing share metadata. Asset optimization stays in place under the same filename, and removing a homepage reference does not authorize deleting the underlying asset.","steps":[["Reference","Use the original isaac.JPG in Me."],["Retain","Keep existing app icons, employer marks, berkeley-seal.png and unlinked Resume.pdf."],["Verify case","Check every changed src/href against the on-disk filename."]],"cond":[]},{"id":"E","code":"E","name":"External services and links","short":"FONTS & LINKS","group":"assets","gx":13.5,"gy":8,"w":3,"d":2,"h":30,"kind":"slab","one":"No third party at all any more: the one webfont is served from this origin, and the only outbound links are ordinary ones.","what":"Nothing on the site fetches anything off-origin. Inter is self-hosted for the pages that need a webfont; the homepage and the legal pages use installed system faces, and so do the code blocks on /shootsort/ and 404.html. The personal homepage has one company destination inside My company and ordinary personal contact links. No YouTube player or third-party script is embedded anywhere.","how":"The CSP grants neither Google font host: <code>font-src 'self'</code>, and <code>/fonts/inter-latin*.woff2</code> is declared by <code>css/site.css</code>, because a render-blocking <code>&lt;link&gt;</code> to <code>fonts.googleapis.com</code> meant a network that blackholes Google produced no first paint at all. JetBrains Mono was dropped with it — 31KB to set four ASCII lines — so there is no code face. The <code>www.youtube-nocookie.com</code> <code>frame-src</code> grant left over from the earlier photo page is removed; nothing on the site frames anything, so <code>default-src 'self'</code> is the fallback. <code>script-src</code> carries no <code>'unsafe-inline'</code> — it allowlists the sha256 hashes of the two pre-paint theme IIFEs and the pricing JSON-LD block, so an injected inline script is refused. Visiting FIRSTUNIT navigates to another site; it is not an embedded runtime dependency.","steps":[["Load fonts","Serve Inter from /fonts/ on this origin, or use an installed face."],["Visit company","The company section links to https://firstunit.io."],["Contact Isaac","Footer links open the chosen personal contact destination."],["Keep scope","Do not add analytics, tag managers, external scripts or portfolio embeds."]],"cond":[]},{"id":"H","code":"H","name":"Fleet commit hooks","short":"COMMIT HOOKS","group":"ship","gx":10.5,"gy":3.5,"w":2.5,"d":2,"h":38,"kind":"gate","one":"The one gate in the whole pipeline — a badly-worded commit message is refused before anything ships.","what":"This repo borrows the fleet's shared git hooks. A commit whose subject is not a Conventional Commit is rejected outright; a commit that passes gets logged into the CodeByIP dashboard feed.","how":"<code>core.hooksPath</code> points at <code>/Users/isaacperez/Coding/platform/scripts/hooks</code>. <code>commit-msg</code> enforces Conventional Commits. <code>post-commit</code> logs into the CodeByIP activity feed on a best-effort basis; the shared Swift-lint pre-commit hook has no Swift source to lint here. Preview and explicit production approval remain separate from these hooks.","steps":[["Write the message","Use type(scope): subject, such as feat(site): simplify the personal homepage."],["Run hooks","Commit normally; do not use --no-verify without explicit permission."],["Review preview","Verify the homepage and retained utility routes before production publication."],["Publish when approved","A push to main triggers Vercel."]],"cond":[{"q":"Does this repository need a new CI or build pipeline for the personal homepage?","r":"No. The approved implementation remains vanilla static HTML/CSS/JS; Vercel git integration is the deployment pipeline (2026-09-11)."}]},{"id":"V","code":"V","name":"Vercel","short":"VERCEL","group":"ship","gx":10.5,"gy":0.5,"w":3,"d":2.5,"h":28,"kind":"slab","one":"The host: it watches main, and whatever is in the tree becomes the live site.","what":"There is no build. Vercel clones the repo, serves the files as they are, gives each directory an extensionless URL, and terminates TLS on the apex domain. Pushing to main is publishing.","how":"Vercel project <code>isaacperez</code>, root <code>.</code>, serves GitHub <code>IsaacAPerez/IsaacPerez.co</code>; the project and team ids live in the Vercel dashboard and are deliberately not recorded in this public repo. <code>vercel.json</code> has response headers and two permanent photo redirects, with no build command or rewrites. <code>.vercelignore</code> withholds the repo-only files — <code>AGENTS.md</code>, <code>CLAUDE.md</code>, <code>docs/</code>, the unlinked <code>Resume.pdf</code>, the retired game bundle (<code>js/game.js</code>, <code>css/game.css</code>, <code>css/rpg.css</code>) and the unreferenced <code>images/</code> icons — from the upload, so they exist in the repository but not at a URL. The custom <code>404.html</code> handles unknown URLs. Git push to main publishes production; the three design branches are review alternatives until a version is approved.","steps":[["Preview","Review a branch locally before publication."],["Push approved main","Vercel receives the git update."],["Serve files","The repository tree supplies the static output."],["Route","Directory indexes serve retained pages; /photo and /photo/ return HTTP 308."],["Verify","Check changed content, utility pages and redirects after publication."]],"cond":[{"q":"Does /photo/ still correspond to an HTML file?","r":"No. The file is removed and vercel.json returns HTTP 308 to https://firstunit.io/fu-0001. The existing rule is preserved by the personal-site redesign (2026-09-11)."}]},{"id":"O","code":"O","name":"Discovery surface","short":"DISCOVERY","group":"ship","gx":14,"gy":4,"w":2.5,"d":2,"h":34,"kind":"box","one":"Seven sitemap pages remain discoverable even though the homepage is much smaller.","what":"The sitemap, robots file, per-page canonicals, share metadata and pricing OfferCatalog remain. Removing a homepage card does not remove its public URL from the sitemap.","how":"<code>sitemap.xml</code> lists <code>/</code>, <code>/photo/pricing/</code>, <code>/shootsort/</code>, <code>/souvenir/privacy/</code>, and the three <code>/roommate/</code> pages. <code>/photo/</code> is excluded because it redirects. <code>404.html</code> is excluded and marked noindex. The homepage, pricing and ShootSort retain Open Graph and Twitter metadata; pricing retains its OfferCatalog. A future route change requires updating sitemap and canonical tags together.","steps":[["Preserve","Keep all seven existing loc entries."],["Canonicalize","Each public page points to its exact production URL."],["Share","Metadata continues to identify the personal site or specific utility page."],["Audit","Compare sitemap paths, real pages and intentional redirects."]],"cond":[{"q":"Should the reduced homepage remove the pricing, ShootSort or legal URLs from the sitemap?","r":"No. The user approved keeping all seven routes functional and unchanged. Homepage promotion and route existence are separate decisions (2026-09-11)."}]},{"id":"X","code":"X","name":"RPG redesign","short":"RPG.CSS","group":"off","ghost":true,"gx":14,"gy":0.5,"w":2.5,"d":2,"h":34,"kind":"box","one":"Designed for, not switched on: a whole RPG-styled skin for the site, written and then never linked to anything.","what":"An abandoned fantasy/RPG stylesheet remains in the repository without any active reference. The later office game is also now dormant, but its files are separate from this earlier unused skin.","how":"<code>css/rpg.css</code> is retained and loaded by no page. The operating manual explicitly forbids linking, refactoring or deleting it without Isaac requesting that work. It contributes no homepage network or rendering dependency.","steps":[["Written","A full alternate skin lands in one commit."],["Orphaned","The direction changes the next day; no stylesheet link is ever added."],["Kept","It ships with every deploy, unreferenced, as a deliberate archive."]],"cond":[{"q":"Delete it, or wire it up as an alternate theme?","r":"Neither, without asking. AGENTS.md rules it off-limits: never link, refactor, or delete css/rpg.css unless Isaac explicitly asks for it (2026-08-24)."}]}];

const CH = [{"id":"page","title":"A personal page and a static host","reveal":["L","V"],"lede":"Me → Experience → My company, served as hand-written HTML.","story":"<p>The homepage introduces Isaac with his original portrait, then presents his engineering experience, UC Berkeley EECS education, and the company he founded. Personal contact sits in the footer. FIRSTUNIT branding is confined to its company section.</p><p>Vercel serves the repository directly. There is no application build; a push to main publishes production after the preview is approved.</p>","flow":[["L","V","GET /",{"path":"/"}],["V","L","200 index.html",{"sections":3,"build":"none"}]]},{"id":"dress","title":"Homepage assets","reveal":["C","I","E"],"lede":"A dedicated stylesheet, the original portrait and existing font integration.","story":"<p><code>css/personal.css</code> owns the homepage layout and may use <code>css/site.css</code> base tokens. Utility pages retain their existing sheets. The original <code>isaac.JPG</code> stays in Me, with exact filename case.</p><p>The only company destination is <code>https://firstunit.io</code>, linked from My company. There is no homepage photography player, app-icon catalogue or pricing promotion.</p>","flow":[["L","C","homepage styles",{"sheet":"css/personal.css"}],["L","I","portrait",{"src":"isaac.JPG"}],["L","E","company link",{"href":"https://firstunit.io","section":"My company"}]]},{"id":"alive","title":"A small, separate runtime","reveal":["M","T","S"],"lede":"Editorial uses native scroll reveals and CSS hover motion; theme remains the active saved preference.","story":"<p>The inline theme script remains in the head before the stylesheets. <code>js/personal.js</code> adds one-time scroll reveals with IntersectionObserver and native Web Animations; content remains visible without JavaScript or animation support. <code>css/personal.css</code> adds the rounded portrait mask, fine-pointer hover zoom, timed underlines, arrow movements and theme transitions.</p><p>Live reduced-motion changes cancel reveals, while focus and hash navigation expose their destinations immediately. Anchors retain native scrolling. Utility pages keep <code>js/site.js</code> unchanged, and no external motion dependency or game-state activity is added.</p>","flow":[["S","T","saved theme",{"key":"theme"}],["T","L","data-theme",{"prePaint":true}],["L","M","deferred script",{"src":"js/personal.js"}]]},{"id":"office","title":"The office is dormant","reveal":["G","A"],"lede":"The source assets remain; the homepage no longer initializes or exposes the game.","story":"<p><code>js/game.js</code> and <code>css/game.css</code> are retained without homepage references. The canvas, controls, inline achievement engine and toast UI have been removed from the active page.</p><p>No active visitor flow enters these structures. Historic browser values are left alone. Restoring the office would be a new scope decision.</p>","flow":[]},{"id":"photo","title":"Retained photo URLs","reveal":["P","R","O"],"lede":"The old photo route redirects; pricing stays available without homepage promotion.","story":"<p><code>/photo</code> and <code>/photo/</code> still return HTTP 308 to the existing FIRSTUNIT Studios record. <code>/photo/pricing/</code> retains its offers and shared utility assets.</p><p>All seven sitemap pages remain. A simplified homepage does not authorize deleting, moving or silently changing existing public services.</p>","flow":[["V","P","308 /photo/",{"destination":"https://firstunit.io/fu-0001"}],["V","R","200 /photo/pricing/",{"preserved":true}],["R","O","OfferCatalog",{"offers":4}]]},{"id":"product","title":"The retained download page","reveal":["D"],"lede":"ShootSort remains reachable at its existing URL.","story":"<p><code>/shootsort/</code> keeps its instructions and working public release download. There is no ShootSort product card on the new homepage.</p><p>The page continues loading <code>/css/site.css</code>, its scoped style block and <code>/js/site.js</code>. Its existing navigation back to the personal site resolves through retained native anchors.</p>","flow":[["V","D","200 /shootsort/",{"path":"/shootsort/"}],["D","C","utility stylesheet",{"href":"/css/site.css"}],["D","O","existing sitemap entry",{"preserved":true}]]},{"id":"legal","title":"The pages that remain permanent","reveal":["Q","H"],"lede":"Four app-facing documents and the existing commit hooks stay in place.","story":"<p><code>/roommate/{privacy,terms,support}/</code> and <code>/souvenir/privacy/</code> remain unchanged. App metadata and external systems depend on them; the personal homepage redesign does not alter their content or paths.</p><p>Fleet hooks continue enforcing Conventional Commits and recording changes. Preview the site before an approved production push.</p>","flow":[["V","Q","retained legal documents",{"count":4}],["Q","C","legal stylesheet",{"href":"/css/legal.css"}]]},{"id":"ghost","title":"Other retained legacy assets","reveal":["X"],"lede":"Unlinked files stay unlinked instead of becoming a new cleanup project.","story":"<p><code>css/rpg.css</code> remains dormant and protected by the operating manual. Existing product icons and the old, unlinked résumé also remain on disk, and <code>.vercelignore</code> keeps all of them out of the deployment: retained in the repository is not the same as published at a URL.</p><p>Removing a homepage feature does not require deleting its assets or changing public URLs.</p>","flow":[["X","C","unlinked legacy stylesheet",{"file":"css/rpg.css","references":0}]]},{"id":"all","title":"The whole system","reveal":[],"lede":"The personal homepage, retained utilities, dormant assets and static deployment together.","story":"<p>Choose a first visit, a retained utility-page visit or an approved publication flow. Dormant office and achievement structures are labelled explicitly and have no active visitor flow.</p><p>The question index records scope decisions and the remaining utility-page maintenance question.</p>","flow":null}];
const HOW_HTML = "<div class=\"eyebrow\">isaac-perez-co · static · Vercel</div><h1 class=\"t\">How it's built</h1><div class=\"sub\">A personal homepage, six retained utility pages, no application build</div>\n<h3 class=\"sec\">The personal homepage</h3>\n<p><b>Me → Experience → My company.</b> The original portrait stays in Me. Experience includes Tinder, Nextdoor, and UC Berkeley (Electrical Engineering &amp; Computer Science). FIRSTUNIT branding appears only in My company, with one destination: <code>https://firstunit.io</code>. Personal contact closes the page quietly.</p>\n<p>The homepage does not contain an apps catalogue, photography portfolio, pricing promotion, office game, achievement UI or skills marquee. Dedicated <code>css/personal.css</code> and <code>js/personal.js</code> keep each personal-page version separate from the unchanged utility-page styles and behavior.</p>\n<h3 class=\"sec\">Filesystem</h3><pre>IsaacPerez.co/\n  index.html            Me → Experience → My company; personal contact footer\n  css/\n    personal.css        homepage only; may use site.css base tokens\n    site.css            shared utility-page styling and base tokens\n    photo.css           /photo/pricing/ only\n    legal.css           four legal-style pages: the design system's tokens, none of its components\n    design-system.css   fleet design system, byte-identical to 3 sibling repos; unlinked here, not deployed\n    game.css            retained office chrome; not loaded, not deployed\n    rpg.css             abandoned redesign; no references, not deployed\n  js/\n    personal.js         homepage theme and accessible one-time scroll reveals\n    site.js             retained utility-page motion and theme behavior\n    game.js             retained office implementation; not loaded, not deployed\n  photo/\n    (no index.html; /photo and /photo/ return 308 via vercel.json)\n    pricing/index.html  retained pricing and OfferCatalog; unpromoted on homepage\n  shootsort/index.html  retained macOS download page; unpromoted on homepage\n  roommate/\n    privacy/index.html  Quarters privacy policy\n    terms/index.html    Quarters terms\n    support/index.html  Quarters support summary and canonical-page link\n  souvenir/\n    privacy/index.html  rendered from Souvenir/docs/privacy.md\n  404.html              custom not-found page\n  images/               retained product icons; unreferenced, not deployed\n  isaac.JPG  isaac.avif  original portrait; AVIF is what a browser takes, JPEG is the fallback and the JSON-LD image\n  fonts/                self-hosted Inter; JetBrains Mono is repo-only, for docs/og/cards.html\n  Resume.pdf            old résumé, retained, unlinked and not deployed\n  favicon.svg  ndLogo.webp  tinderLogo.png\n  berkeley-seal.png     Berkeley seal, 96×96 PNG (3× its 32px render box)\n  sitemap.xml  robots.txt  vercel.json\n  .vercelignore         repo-only files withheld from the deployment\n  AGENTS.md             operating manual; repo-only, not served\n  .vercel/              gitignored Vercel linkage\n  docs/atlas/           data.mjs → atlas.html + SYSTEM.md; repo-only, not served</pre>\n<h3 class=\"sec\">Active and dormant code</h3>\n<p><code>js/personal.js</code> handles the homepage theme and one-time scroll reveals through IntersectionObserver and native Web Animations. Baseline content is always visible; reduced motion, unsupported APIs, focus and hash navigation skip or cancel the relevant reveals. CSS supplies a 28px portrait mask, fine-pointer hover zoom, timed underlines, arrow movements and theme transitions. Native smooth scrolling becomes immediate under reduced motion, including preference changes during the visit. No external animation dependency is added.</p><p><code>js/site.js</code> remains unchanged on retained utility pages. The inline head theme script stays before stylesheets, runtime storage access is guarded, and <code>theme</code> remains the active persistent preference.</p>\n<p><code>js/game.js</code> and <code>css/game.css</code> remain on disk without a homepage entry point or initialization. The old inline achievement integration is removed. Existing game-state keys are left alone. <code>css/rpg.css</code> and the old <code>Resume.pdf</code> remain unlinked. None of them is uploaded: <code>.vercelignore</code> lists the game bundle, <code>images/</code> and the résumé alongside the repo-only docs.</p>\n<h3 class=\"sec\">Retained public pages</h3>\n<pre>/                       index.html\n/photo/pricing/         photo/pricing/index.html\n/shootsort/             shootsort/index.html\n/souvenir/privacy/      souvenir/privacy/index.html\n/roommate/privacy/      roommate/privacy/index.html\n/roommate/terms/        roommate/terms/index.html\n/roommate/support/      roommate/support/index.html</pre>\n<p>All seven remain in <code>sitemap.xml</code>. Pricing and ShootSort remain functional but are not promoted on the homepage. Legal pages and their substance remain unchanged. The utility-page navs mirror the homepage's own sections — Me (#about), Experience (#experience), FIRSTUNIT (#firstunit) — plus the #contact footer CTA. The legacy #work target stays inside Experience for old inbound links, but no page navigates to it.</p>\n<p><code>/photo</code> and <code>/photo/</code> are not pages or sitemap entries: Vercel returns HTTP 308 to <code>https://firstunit.io/fu-0001</code>. The external retired <code>capturedbyip.com</code> domain returns HTTP 301 directly to that destination (verified 2026-09-11). <code>404.html</code> handles unknown URLs and stays noindex.</p>\n<h3 class=\"sec\">Hosting and review</h3>\n<p>Vercel project <code>isaacperez</code> serves the repository root from GitHub <code>IsaacAPerez/IsaacPerez.co</code>; the project and team ids stay in the dashboard, not in this public repo. There is no application build, framework or CI. <code>vercel.json</code> retains the photo redirects and the response headers: hash-based CSP, HSTS with <code>includeSubDomains</code>, <code>nosniff</code>, <code>DENY</code> framing, referrer and permissions policy, and a same-origin CORS grant. <code>.vercelignore</code> keeps <code>AGENTS.md</code>, <code>CLAUDE.md</code>, <code>docs/</code>, <code>Resume.pdf</code>, the retired game bundle and <code>images/</code> out of the deployment. A push to main publishes production; review branches and previews are not production publication.</p>\n<p>Fleet hooks enforce Conventional Commits and record activity. Preview with any static server; test header or redirect changes with a server that replays Vercel behavior. Machine-level monitoring is configured outside this repository and must not be changed as incidental website cleanup.</p>\n<h3 class=\"sec\">Rules that remain</h3>\n<p>Use exact filename case, relative homepage assets and absolute nested-page assets. Keep the original portrait and the pre-paint theme script. Do not add new external scripts, analytics, build tooling or dependencies. Do not move public URLs or alter app legal content as part of a personal-page layout change. Edit this atlas through <code>docs/atlas/data.mjs</code> and rebuild both generated views.</p>";
const DECISIONS_HTML = "<li><b>Runtime.</b> Vanilla HTML/CSS/JS, one IIFE per script. No framework, package.json, bundler, node_modules or application build. The repository tree is the site.</li><li><b>Homepage.</b> Me → Experience → My company, then a quiet personal contact footer. Retain the original portrait. No apps catalogue, photography portfolio, pricing promotion, office game, achievements or skills marquee.</li><li><b>FIRSTUNIT.</b> Company branding appears only in the homepage company section, with one company destination: https://firstunit.io. Personal identity, employer experience and contact remain independent of the company brand.</li><li><b>Asset ownership.</b> css/personal.css and js/personal.js own homepage behavior and styling. css/site.css may supply base tokens but remains unchanged with js/site.js for utility pages. Game files and app icons are retained without homepage promotion and withheld from the deployment; css/rpg.css remains unlinked.</li><li><b>Hosting.</b> Vercel git integration publishes main with no build step. vercel.json retains the response headers and permanent /photo redirects; production publication requires the approved preview.</li><li><b>Theme and motion.</b> Keep the inline pre-paint theme script and localStorage theme preference. Guard runtime storage access and honor prefers-reduced-motion. The homepage no longer awards badges or bakes game art.</li><li><b>Asset paths.</b> Root homepage asset paths are relative. Nested pages and 404.html use absolute paths. All references must match filename case exactly.</li><li><b>Existing URLs.</b> All seven sitemap pages remain. Pricing and ShootSort are retained but unpromoted; /photo and /photo/ continue to return HTTP 308 to https://firstunit.io/fu-0001. Keep legal URLs permanent and preserve utility-page navigation back to the homepage.</li><li><b>Commits.</b> Fleet hooks enforce Conventional Commits. Do not bypass them or push an unapproved landing-page change to main.</li>";

function bendFor(a,b){ const t=FLOWS[0].hops.find(h=>h[0]===a&&h[1]===b)||FLOWS[1].hops.find(h=>h[0]===a&&h[1]===b); return t?(t[4]||'xy'):'yx'; }

function hopPath(h){

    <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
    <p>Payload shapes are what the design implies, not measured traffic.</p>
    <div class="actions"><button class="ctl" onclick="stepOnce()">Trace one step</button><button class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
  const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
  if(!n){ renderChapterPanel(); return; }
  if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${n.group==='loop'?'turn loop':n.group==='mem'?'memory':'supporting'}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
