<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1d1f">
  <meta name="description" content="Buckets was retired on October 22, 2026. Contact support about the former app.">
  <meta name="author" content="Isaac Perez">
  <meta name="robots" content="index, follow">

  <!-- Open Graph. These pages are reached deep-linked from an App Store
       listing or in-app Settings, never via the homepage, so the share
       bubble is the whole first impression. Values mirror the title,
       description and canonical above -- keep the four in step. -->
  <meta property="og:title" content="Support — Buckets">
  <meta property="og:description" content="Buckets was retired on October 22, 2026. Contact support about the former app.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://isaacperez.co/buckets/support/">
  <meta property="og:site_name" content="Isaac Perez">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="https://isaacperez.co/buckets/support/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <title>Support — Buckets</title>

  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (error) { /* Theme still works when storage is unavailable. */ }
    })();
  </script>

  <link rel="stylesheet" href="/css/legal.css">
  <link rel="stylesheet" href="/css/firstunit-attribution.css">
</head>
<body>
  <main class="legal-container">
    <header class="legal-header">
      <div class="legal-eyebrow">Buckets iOS App</div>
      <h1 class="legal-title">Support</h1>
      <p class="legal-meta">Retired October 22, 2026</p>
    </header>

    <article class="legal-content">
      <h2>Buckets has been retired</h2>
      <p>
        Buckets, formerly Hoopline, was retired on October 22, 2026.
        Development and video processing have ended.
      </p>

      <h2>Contact</h2>
      <p>
        For questions about the former app or your data, email
        <a href="mailto:buckets@firstunit.io">buckets@firstunit.io</a>.
      </p>
    </article>

    <footer class="legal-footer">
      <div class="product-footer-credit"><a class="firstunit-attribution" href="https://firstunit.io">A FIRSTUNIT PRODUCT</a></div>
    </footer>
  </main>
</body>
</html>
